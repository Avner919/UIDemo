<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Clock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f7;
      color: #17253b;
      font-family: system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #17253b12;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #586579; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #9aa8bb;
      border-radius: 8px;
      background: white;
      color: inherit;
      font: inherit;
    }
    select:focus-visible { outline: 3px solid #9bc0ff; outline-offset: 3px; }
    .clock { margin-top: 28px; text-align: center; }
    time {
      display: block;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    #date { margin-top: 8px; color: #586579; }
  </style>
</head>
<body>
  <main>
    <h1>City Clock</h1>
    <p>The local time, wherever you choose.</p>
    <label for="city">Choose a city</label>
    <select id="city">
      <option value="Europe/London">London</option>
      <option value="Europe/Paris">Paris</option>
      <option value="America/New_York">New York</option>
      <option value="Asia/Tokyo">Tokyo</option>
      <option value="Europe/Moscow">Moscow</option>
    </select>
    <div class="clock">
      <time id="time" aria-label="Current local time"></time>
      <div id="date"></div>
    </div>
    <noscript>Enable JavaScript to see the current local time.</noscript>
  </main>
  <script>
    const city = document.getElementById('city');
    const time = document.getElementById('time');
    const date = document.getElementById('date');

    function updateClock() {
      const now = new Date();
      const timeZone = city.value;
      time.textContent = new Intl.DateTimeFormat('en-GB', {
        timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      }).format(now);
      time.dateTime = now.toISOString();
      date.textContent = new Intl.DateTimeFormat('en-GB', {
        timeZone, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(now);
    }

    city.addEventListener('change', updateClock);
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
